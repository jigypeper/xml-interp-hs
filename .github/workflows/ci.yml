name: CI

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

permissions:
  contents: read

jobs:
  Test:

    runs-on: ubuntu-latest  

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4  

    - name: Install ghcup (Haskell toolchain manager)
      run: |
        curl --proto '=https' --tlsv1.2 -sSf https://get-ghcup.haskell.org | sh
        source ~/.ghcup/env  

    - name: Install GHC and Cabal
      run: |
        ghcup install ghc 9.4.8  
        ghcup install cabal 3.10.3  
        ghcup set ghc 9.4.8  
        ghcup set cabal 3.10.3  
        ghc --version  
        cabal --version  

    - name: Cache Cabal dependencies
      uses: actions/cache@v3
      with:
        path: |
          ~/.cabal
          ~/.ghc
        key: ${{ runner.os }}-build-${{ hashFiles('**/*.cabal') }}-${{ hashFiles('**/cabal.project') }}
        restore-keys: |
          ${{ runner.os }}-build-

    - name: Install GTK development packages
      run: |
        sudo apt-get update
        sudo apt-get install -y libgtk2.0-dev libglib2.0-dev

    - name: Install dependencies
      run: |
        cabal update
        cabal build --only-dependencies --enable-tests --enable-benchmarks

    - name: Run tests
      run: cabal test --enable-tests --enable-benchmarks all
